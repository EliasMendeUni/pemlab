[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pemlab"
dynamic = ["version"]
description = "Tools for measurement data analysis and lab reports in physical and electronic measurement technology"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elias Mende" }]
keywords = ["measurement", "data analysis", "lab report", "physics", "latex"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "sympy",
    "csvtex",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
instruments = ["pyvisa", "pyvisa-py"]
docs = ["sphinx", "furo", "myst-nb"]

[tool.hatch.version]
path = "src/pemlab/__init__.py"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
