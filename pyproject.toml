[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pemlab"
dynamic = ["version"]
description = "Hilfswerkzeuge für Messdatenanalyse und Protokolle in der Physikalischen und Elektronischen Messtechnik"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elias Mende" }]
keywords = ["Messtechnik", "Messdaten", "Protokoll", "Physik"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.hatch.version]
path = "src/pemlab/__init__.py"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
